<!doctype html>
<!--
  Ícone do site (aba do navegador, resultado do Google, tela inicial do celular).
  Monograma provisório "C" de Corradi, até chegar o arquivo do logo da clínica.

  Para gerar de novo: print de 512x512 num Chrome sem cabeçalho (headless).
  - sem nada no endereço: cantos arredondados e fundo transparente, para
    public/favicon.ico (16, 32 e 48 px) e public/icon-192.png;
  - com #cheio no endereço: quadrado inteiro, para public/apple-touch-icon.png
    (180 px; o iPhone arredonda sozinho e pinta de preto o que for transparente).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&text=C&display=block"
    />
    <style>
      * { margin: 0; }
      html, body { width: 512px; height: 512px; background: transparent; }
      .icone {
        width: 512px;
        height: 512px;
        border-radius: 112px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(70% 70% at 30% 20%, oklch(0.76 0.1 78 / 0.22), transparent 70%),
          oklch(0.2 0.018 50);
      }
      .cheio .icone { border-radius: 0; }
      .letra {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 440px;
        line-height: 1;
        /* Medido no print: centra a caixa da letra e puxa 3 px para a direita,
           porque o C é aberto desse lado e o peso visual fica à esquerda. */
        transform: translate(4px, -10px);
        background: linear-gradient(160deg, oklch(0.9 0.07 85), oklch(0.74 0.1 75));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="icone"><span class="letra">C</span></div>
    <script>
      if (location.hash === "#cheio") document.body.classList.add("cheio");
    </script>
  </body>
</html>
