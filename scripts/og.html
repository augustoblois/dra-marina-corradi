<!doctype html>
<!--
  Imagem da prévia do link (og:image), 1200x630: o que aparece quando alguém
  manda o site no WhatsApp, no Instagram ou no Facebook.

  Para gerar de novo: abrir este arquivo num Chrome sem cabeçalho (headless),
  janela de 1200x630, esperar as fontes carregarem e salvar o print como
  public/og-volformer.jpg (JPEG, qualidade ~88). O texto segue as regras da
  página: nome e CRM da médica, sem promessa de resultado (CFM).
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Montserrat:wght@500;600&display=block"
    />
    <style>
      :root {
        --espresso: oklch(0.2 0.018 50);
        --cream: oklch(0.975 0.008 78);
        --gold: oklch(0.76 0.1 78);
        --gold-bright: oklch(0.87 0.075 85);
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background:
          radial-gradient(60% 80% at 8% 0%, oklch(0.76 0.1 78 / 0.16), transparent 70%),
          radial-gradient(50% 60% at 100% 100%, oklch(0.6 0.105 55 / 0.18), transparent 70%),
          var(--espresso);
        font-family: "Montserrat", sans-serif;
        color: var(--cream);
        -webkit-font-smoothing: antialiased;
      }
      .texto {
        position: absolute;
        left: 84px;
        top: 50%;
        transform: translateY(-50%);
        width: 560px;
      }
      .rotulo {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: var(--gold);
      }
      h1 {
        margin-top: 22px;
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: 104px;
        line-height: 0.94;
        letter-spacing: -0.01em;
      }
      .sub {
        margin-top: 18px;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 500;
        font-size: 46px;
        line-height: 1.05;
        color: var(--gold-bright);
      }
      .linha {
        margin: 34px 0 26px;
        width: 96px;
        height: 2px;
        background: linear-gradient(90deg, var(--gold), transparent);
      }
      .nome { font-size: 26px; font-weight: 600; }
      .crm { margin-top: 8px; font-size: 19px; font-weight: 500; color: oklch(0.975 0.008 78 / 0.72); }
      .arco,
      .moldura {
        position: absolute;
        right: 92px;
        bottom: 0;
        width: 440px;
        height: 560px;
        border-radius: 220px 220px 0 0;
      }
      .moldura {
        right: 76px;
        height: 576px;
        width: 472px;
        border-radius: 236px 236px 0 0;
        border: 1.5px solid oklch(0.76 0.1 78 / 0.7);
        border-bottom: 0;
      }
      .arco {
        overflow: hidden;
        background: #d9d8d6;
      }
      .arco img {
        position: absolute;
        width: 560px;
        left: -78px;
        top: -40px;
      }
    </style>
  </head>
  <body>
    <div class="texto">
      <p class="rotulo">CORRADI DERMA · ITU-SP</p>
      <h1>Protocolo<br />Volformer</h1>
      <p class="sub">efeito lifting sem cirurgia</p>
      <div class="linha"></div>
      <p class="nome">Dra. Marina Corradi</p>
      <p class="crm">Médica · CRM-SP 264323</p>
    </div>
    <div class="moldura"></div>
    <div class="arco"><img src="../public/media/dra-vinho-1200.webp" alt="" /></div>
  </body>
</html>
